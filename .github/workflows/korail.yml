# Daily Korail trunk-train records (KTX-이음, ITX-청춘, 무궁화 ...) for overlay analysis.
# Actual times are published the next day, so each run fetches yesterday's records
# plus today's/tomorrow's plans. Needs the repository secret DATA_GO_KR_KEY.
name: korail

on:
  schedule:
    - cron: "5 2 * * *"   # 11:05 KST
  workflow_dispatch:
    inputs:
      date:
        description: "run date YYYY-MM-DD (default: yesterday KST)"
        default: ""

concurrency: korail

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          RUN_DATE: ${{ inputs.date }}
        run: python scripts/fetch_korail.py --out korail-out ${RUN_DATE:+--date "$RUN_DATE"}
      - name: Save to collected-data branch
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          store="$RUNNER_TEMP/store"
          if git ls-remote --exit-code --heads "$remote" collected-data >/dev/null; then
            git clone --quiet --depth 1 --branch collected-data "$remote" "$store"
          else
            git init --quiet -b collected-data "$store"
            git -C "$store" remote add origin "$remote"
          fi
          mkdir -p "$store/korail"
          cp korail-out/* "$store/korail/"
          cd "$store"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "korail: ${RUN_DATE:-yesterday}" || { echo "nothing to save"; exit 0; }
          git push --quiet origin collected-data
